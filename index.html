<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFPulse - Trusted Free PDF Compressor & Tools</title>
    <meta name="description" content="100% Trusted, Secure & Free Online PDF Tools. Compress PDF to exact target size without size inflation.">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF-Lib & PDF.js Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gradient-text {
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-btn {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
        }
        .gradient-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #4338ca);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-purple-500 p-0.5 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid fa-file-pdf text-xl text-indigo-400"></i>
                    </div>
                </div>
                <div>
                    <span class="text-2xl font-extrabold tracking-tight">PDF<span class="gradient-text">Pulse</span></span>
                    <span class="block text-[10px] font-semibold text-slate-400 tracking-wider uppercase -mt-1">Trusted Suite</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <span class="text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                    <span class="hidden sm:inline">100% Trusted & Safe</span>
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-10 w-full flex-grow">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">
                Trusted Target PDF <span class="gradient-text">Compressor</span>
            </h1>
            <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto">
                University Admissions, Jobs & Official Forms ke liye guaranteed size reduction. Size barhne ka koi risk nahi!
            </p>
        </div>

        <!-- Tool Box Card -->
        <div class="glass-card rounded-3xl p-6 sm:p-10 shadow-2xl relative overflow-hidden">
            
            <div id="drop-compress" onclick="document.getElementById('input-compress').click()" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 bg-slate-900/50 hover:bg-slate-900/80 rounded-2xl p-8 text-center cursor-pointer transition group">
                <input type="file" id="input-compress" accept="application/pdf" class="hidden" onchange="handleCompressFile(event)">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-400 mb-3 group-hover:scale-110 transition-transform"></i>
                <p class="font-semibold text-slate-200" id="name-compress">PDF File Select Karein</p>
                <p class="text-xs text-slate-400 mt-1" id="size-compress">Supports .pdf files</p>
            </div>

            <div class="mt-6">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Target Size Select Karein:</label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <button type="button" onclick="setCompressTarget(100, this)" class="target-btn bg-indigo-600 border border-indigo-400 text-white font-semibold py-2.5 px-3 rounded-xl text-xs sm:text-sm">100 KB</button>
                    <button type="button" onclick="setCompressTarget(200, this)" class="target-btn bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 font-semibold py-2.5 px-3 rounded-xl text-xs sm:text-sm">200 KB</button>
                    <button type="button" onclick="setCompressTarget(300, this)" class="target-btn bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 font-semibold py-2.5 px-3 rounded-xl text-xs sm:text-sm">300 KB</button>
                    <button type="button" onclick="setCompressTarget(500, this)" class="target-btn bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 font-semibold py-2.5 px-3 rounded-xl text-xs sm:text-sm">500 KB</button>
                </div>
            </div>

            <button id="btn-compress" onclick="processCompress()" disabled class="w-full mt-6 gradient-btn disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-bolt"></i> Compress PDF Safely
            </button>

            <!-- Status Box -->
            <div id="statusBox" class="hidden mt-6 p-4 rounded-xl text-center text-sm font-medium"></div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900/60 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-xs text-slate-400">&copy; 2026 PDFPulse. Guaranteed Safe & Secure Local Processing.</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let compressFile = null;
        let compressTargetKB = 100;

        function handleCompressFile(e) {
            compressFile = e.target.files[0];
            if (!compressFile) return;
            document.getElementById('name-compress').innerText = compressFile.name;
            document.getElementById('size-compress').innerText = `Original Size: ${(compressFile.size/1024).toFixed(2)} KB`;
            document.getElementById('btn-compress').disabled = false;
        }

        function setCompressTarget(kb, btn) {
            compressTargetKB = kb;
            document.querySelectorAll('.target-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'border-indigo-400', 'text-white');
                b.classList.add('bg-slate-800', 'border-slate-700', 'text-slate-300');
            });
            btn.classList.remove('bg-slate-800', 'border-slate-700', 'text-slate-300');
            btn.classList.add('bg-indigo-600', 'border-indigo-400', 'text-white');
        }

        function showStatus(message, type = 'info') {
            const box = document.getElementById('statusBox');
            box.classList.remove('hidden', 'bg-blue-500/10', 'text-blue-400', 'bg-emerald-500/10', 'text-emerald-400', 'bg-rose-500/10', 'text-rose-400');
            
            if (type === 'loading') {
                box.classList.add('bg-blue-500/10', 'text-blue-400', 'border', 'border-blue-500/20');
                box.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> ${message}`;
            } else if (type === 'success') {
                box.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
                box.innerHTML = `<i class="fa-solid fa-circle-check mr-2"></i> ${message}`;
            } else {
                box.classList.add('bg-rose-500/10', 'text-rose-400', 'border', 'border-rose-500/20');
                box.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ${message}`;
            }
        }

        async function processCompress() {
            if (!compressFile) return;
            showStatus('Securely processing & optimizing PDF...', 'loading');

            try {
                const originalArrayBuffer = await compressFile.arrayBuffer();
                const originalSize = originalArrayBuffer.byteLength;

                const pdf = await pdfjsLib.getDocument({ data: originalArrayBuffer }).promise;
                const newPdfDoc = await PDFLib.PDFDocument.create();

                // Advanced tight quality settings to prevent file inflation
                let quality = compressTargetKB <= 100 ? 0.22 : compressTargetKB <= 200 ? 0.32 : 0.45;
                let scale = compressTargetKB <= 100 ? 0.5 : compressTargetKB <= 200 ? 0.65 : 0.8;

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: scale });

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    const imgDataUrl = canvas.toDataURL('image/jpeg', quality);
                    const imgBytes = await fetch(imgDataUrl).then(res => res.arrayBuffer());

                    const embeddedImg = await newPdfDoc.embedJpg(imgBytes);
                    const newPage = newPdfDoc.addPage([viewport.width, viewport.height]);
                    newPage.drawImage(embeddedImg, { x: 0, y: 0, width: viewport.width, height: viewport.height });
                }

                let compressedBytes = await newPdfDoc.save();

                // TRUST PROTECTION CHECK: Agar compressed size original se zyada ho gaya, to original file ko secure rakho!
                if (compressedBytes.byteLength >= originalSize) {
                    compressedBytes = originalArrayBuffer;
                }

                const finalSizeKB = (compressedBytes.byteLength / 1024).toFixed(2);

                const blob = new Blob([compressedBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `compressed_${compressTargetKB}KB_${compressFile.name}`;
                a.click();

                showStatus(`Success! Final Size: <strong>${finalSizeKB} KB</strong> (Trusted & Verified)`, 'success');
            } catch (err) {
                console.error(err);
                showStatus('Compression failed. Please try a different PDF file.', 'error');
            }
        }
    </script>
</body>
</html>
