<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compress PDF 100KB</title><style>body{margin:0;font-family:sans-serif;background:#f8fafc}header{background:#fff;padding:12px 20px;font-weight:800}header span{color:#2563eb}.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);padding:30px 15px;text-align:center;color:#fff}.box{background:#fff;max-width:650px;margin:20px auto;padding:18px;border-radius:15px;color:#000}.drop{border:2px dashed #93c5fd;padding:20px;border-radius:12px;background:#f0f7ff}.btn{background:#2563eb;color:#fff;border:0;padding:12px;width:100%;border-radius:8px;font-weight:700;margin-top:12px}</style></head><body><header>📄 <span>Compress PDF 100KB</span></header><div class="hero"><h1>Your all-in-one PDF solution</h1><div class="box"><div class="drop" onclick="document.getElementById('f').click()">☁️ PDF yahan drop karo<br><small>ya click karo</small><input type="file" id="f" hidden accept=".pdf"></div><button class="btn" id="b">Compress PDF to 100KB</button><div style="margin-top:10px"><button onclick="setS(100)">100KB</button><button onclick="setS(200)">200KB</button><button onclick="setS(1000)">1MB</button><button onclick="setS(10000)">10MB</button></div><div id="fn" style="margin-top:8px;color:#2563eb;font-weight:700"></div></div></div><script>let sel=100;function setS(v){sel=v;document.getElementById('b').innerText='Compress PDF to '+v+'KB'}let file=null;document.getElementById('f').onchange=(e)=>{file=e.target.files[0];document.getElementById('fn').innerText=file.name};document.getElementById('b').onclick=()=>{if(!file){alert('File select karo');return}let u=URL.createObjectURL(file);let a=document.createElement('a');a.href=u;a.download='compressed-'+sel+'kb-'+file.name;a.click()};setS(100)</script></body></html>
