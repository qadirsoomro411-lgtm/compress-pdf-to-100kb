<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compress PDF 200KB</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#f8fafc}header{background:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px #0001;position:sticky;top:0;z-index:99}.logo{font-weight:800;line-height:1;color:#1e3a8a;font-size:26px}nav{display:flex;gap:8px}nav a{padding:8px 18px;border-radius:24px;text-decoration:none;font-weight:600;color:#334155;font-size:14px;cursor:pointer}nav a.active{background:#2563eb;color:#fff}.hero{background:linear-gradient(90deg,#2563eb,#7c3aed);padding:60px 20px 70px}.card{max-width:760px;margin:0 auto;background:#fff;border-radius:22px;padding:28px 24px;box-shadow:0 20px 60px #0003}.drop{border:2px dashed #c7d2fe;border-radius:16px;padding:22px;text-align:center;background:#eef2ff;cursor:pointer}.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.pills button{border:1px solid #e2e8f0;background:#f1f5f9;padding:10px 22px;border-radius:28px;font-weight:700;cursor:pointer}.pills button.active{background:#2563eb;color:#fff}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><header><div class="logo">Compress<br>PDF 200KB</div><nav><a class="active">Compress PDF</a><a>Merge PDF</a><a>JPG to PDF</a><a>PDF to JPG</a><a>Tools ▾</a></nav></header><div class="hero"><div class="card"><div class="drop" onclick="document.getElementById('f').click()"><div style="font-size:36px;color:#2563eb">☁️⬇️</div><b>Drag & Drop your PDF here</b><br><small>or click to browse • Max 100MB • PDF only</small><input type="file" id="f" hidden accept=".pdf"><div id="fn" style="margin-top:10px;color:#2563eb;font-weight:700"></div></div><div style="margin-top:18px;font-weight:600">Choose target file size:</div><div class="pills"><button onclick="setS(100,this)">100KB</button><button class="active" onclick="setS(200,this)">200KB</button><button onclick="setS(300,this)">300KB</button><button onclick="setS(500,this)">500KB</button></div><button id="b" style="margin-top:18px;width:100%;background:#2563eb;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:800;font-size:16px">Compress PDF to 200KB</button><div id="st" style="margin-top:10px;font-weight:700;text-align:center;color:#2563eb"></div><div id="rs" style="text-align:center;margin-top:10px"></div></div><div style="text-align:center;color:#dbeafe;margin-top:18px;font-size:13px">✓ 256-bit SSL secured • ✓ Files auto-deleted after 1 hour</div></div><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let sel=200,file=null;function setS(v,el){sel=v;document.querySelectorAll('.pills button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('b').innerText='Compress PDF to '+v+'KB'}document.getElementById('f').onchange=e=>{file=e.target.files[0];document.getElementById('fn').innerText=file.name+' ('+(file.size/1024).toFixed(0)+'KB)'};document.getElementById('b').onclick=async()=>{if(!file){alert('File select karo');return}let btn=document.getElementById('b');btn.innerText='Compressing...';try{let tgt=sel*1024;let data=await file.arrayBuffer();let pdf=await pdfjsLib.getDocument({data}).promise;const {jsPDF}=window.jspdf;let q=0.5;if(file.size>tgt*3)q=0.25;let out=new jsPDF();for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i);let vp=page.getViewport({scale:0.7});let cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;if(i>1)out.addPage();out.addImage(cv.toDataURL('image/jpeg',q),'JPEG',5,5,200,287)}let blob=out.output('blob');while(blob.size>tgt&&q>0.1){q-=0.1;out=new jsPDF();for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i);let vp=page.getViewport({scale:0.6});let cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;if(i>1)out.addPage();out.addImage(cv.toDataURL('image/jpeg',q),'JPEG',5,5,200,287)}blob=out.output('blob')}document.getElementById('st').innerText='Ho gaya! '+(file.size/1024).toFixed(0)+'KB ➜ '+(blob.size/1024).toFixed(0)+'KB';let url=URL.createObjectURL(blob);document.getElementById('rs').innerHTML='<a href="'+url+'" download="compressed-'+sel+'kb-'+file.name+'" style="background:#16a34a;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:800">📥 Download</a>';let a=document.createElement('a');a.href=url;a.download='compressed-'+sel+'kb-'+file.name;a.click()}catch(e){alert(e.message)}btn.innerText='Compress PDF to '+sel+'KB'}}</script></body></html>
